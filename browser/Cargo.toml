[package]
name = "dropwire-browser"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
bytes = "1"
iroh = { version = "=1.0.2", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "=0.103.0", default-features = false }
n0-future = "0.3"
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
bao-tree = { version = "=0.16.1", default-features = false, features = ["tokio_fsm", "validate"] }
iroh-io = "=0.6.2"
