# cargo-deny configuration, used by the `advisories` job in CI.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# The platforms Dropwire ships on, so advisories for crates that only build
# elsewhere (mobile, wasm) do not fail the check.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
# Unmaintained crates are reported for our own direct dependencies only. Deep
# in Tauri's Linux stack the GTK3 bindings are unmaintained upstream, and that
# is Tauri's to move, not something this repository can change.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # glib < 0.20: unsound `Iterator` impls on `VariantStrIter`. Reached only
    # through Tauri's GTK3 webview stack on Linux (gtk 0.18 pins glib 0.18);
    # Dropwire never calls `VariantStrIter`. Drop this once Tauri moves on.
    { id = "RUSTSEC-2024-0429", reason = "transitive via Tauri's GTK3 stack; VariantStrIter is not used" },
]
