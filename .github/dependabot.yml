# Keep the pinned action SHAs fresh. Actions are pinned to commits so a
# compromised upstream tag cannot silently enter the release pipeline, which
# publishes signed installers under this account. Dependabot raises a PR when
# any of them moves, so pinning does not mean going stale.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
    # Crates that release together move together: one PR, one CI run.
    groups:
      tauri:
        patterns: ["tauri*"]
      iroh:
        patterns: ["iroh*"]
      patch-updates:
        update-types: ["patch"]
