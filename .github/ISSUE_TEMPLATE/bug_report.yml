name: Bug report
description: Something didn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Dropwire.
        **Security issue?** Please don't file it here. Report it privately as described in the
        [security policy](https://github.com/muhamadjawdatsalemalakoum/dropwire/security/policy).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dropwire version
      description: Shown in Settings → About, next to Dropwire (for example 0.3.1).
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release you downloaded
      description: >-
        The tag from the Releases page, if you know it (for example v0.3.1).
        Every 0.3.0 beta shows 0.3.0 in Settings, so this is how those builds are told apart.
      placeholder: v0.3.1
  - type: dropdown
    id: connection
    attributes:
      label: Connection type (if this is a transfer problem)
      description: The badge shown on the transfer card.
      options:
        - Direct
        - Relayed
        - Not sure / didn't get that far
  - type: textarea
    id: logs
    attributes:
      label: Logs, errors, or screenshots
      description: Anything from the app or console that might help.
