# Deploy the Dropwire landing page (www/) to GitHub Pages.
#
# ⚠️ PUBLIC: a GitHub Pages site is served at a PUBLIC URL even when the repo is
# private (on the Free plan). This workflow is therefore **manual-only** — it does
# NOT run on push. Nothing is published until you:
#   1. Repo Settings → Pages → Build and deployment → Source = "GitHub Actions"
#   2. Actions → "Deploy landing page (GitHub Pages)" → Run workflow
# Run it only when you're ready for the landing page to be publicly visible.

name: Deploy landing page (GitHub Pages)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
