name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  # Lets a maintainer check any branch or tag on demand, e.g. the commit about
  # to be tagged for a release.
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Engine: format, lint, build, and test the `irohcore` crate on all three desktop OSes.
  # --locked everywhere so a Cargo.lock that is out of step with the manifests
  # fails CI instead of being quietly re-resolved.
  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three desktop OSes: the repo is public, so Actions minutes are
        # free and the macOS runner is worth it — the nearby feature has
        # macOS-specific paths (mDNS, Local Network permission) that only a
        # macOS job exercises.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        # test-utils so the gated integration tests (nearby consent, relay) are
        # linted too, not just the shipping lib.
        run: cargo clippy -p irohcore --all-targets --features test-utils --locked -- -D warnings

      - name: Build
        run: cargo build -p irohcore --locked --verbose

      - name: Test
        # test-utils is REQUIRED for the nearby consent suite and the relay
        # tests ([[test]] required-features in core/Cargo.toml). Without it those
        # entire suites were silently skipped in CI.
        run: cargo test -p irohcore --features test-utils --locked --verbose

  # Desktop shell: lint, build, and test the `dropwire` crate (Tauri v2) on all three
  # desktop OSes. Without this the shell, its platform-gated code, and any
  # dependency bump that only touches it were first compiled by the release
  # workflow after a tag was pushed. Bundling installers stays in release.yml.
  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Linux dependencies
        # Same WebKitGTK stack the release build installs.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Clippy
        run: cargo clippy -p dropwire --all-targets --locked -- -D warnings

      - name: Build
        # A full build, not just a check, so linking against the platform
        # webview libraries is exercised too.
        run: cargo build -p dropwire --locked

      - name: Test
        run: cargo test -p dropwire --locked
