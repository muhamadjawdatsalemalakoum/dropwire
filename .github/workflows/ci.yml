name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Engine: format, lint, build, and test the `irohcore` crate on all three desktop OSes.
  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three desktop OSes: the repo is public, so Actions minutes are
        # free and the macOS runner is worth it — the nearby feature has
        # macOS-specific paths (mDNS, Local Network permission) that only a
        # macOS job exercises.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        # test-utils so the gated integration tests (nearby consent, relay) are
        # linted too, not just the shipping lib.
        run: cargo clippy -p irohcore --all-targets --features test-utils -- -D warnings

      - name: Build
        run: cargo build -p irohcore --verbose

      - name: Test
        # test-utils is REQUIRED for the nearby consent suite and the relay
        # tests ([[test]] required-features in core/Cargo.toml). Without it those
        # entire suites were silently skipped in CI.
        run: cargo test -p irohcore --features test-utils --verbose

  # Placeholder for the desktop bundle job, enabled once `src-tauri` lands (M2).
  # Uses tauri-apps/tauri-action to produce signed installers per OS.
